<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24211c">
  <title>Bluff Chess</title>
  <meta name="description" content="Chess with hidden pieces. Move one and you claim what it is. Your opponent can call your bluff.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <link rel="preload" href="assets/fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="ui/styles.css">
</head>
<body>
  <!-- Shown until the game has loaded, so a slow first load (or a failed one) is never a blank screen. -->
  <div id="boot" role="status"><div class="boot-word">Bluff <span>Chess</span></div><p id="boot-msg">Shuffling the deck…</p></div>
  <div id="viewport">
    <div id="stage" data-layout="landscape">
      <div id="app">
        <header id="hud" class="hud hidden"></header>
        <main id="screen" class="screen"></main>
        <div id="modal-root"></div>
        <div id="tooltip" class="tooltip hidden"></div>
      </div>
    </div>
  </div>
  <script type="module" src="dist/main.js"></script>
  <script>
    // If a script never arrives, init() can't report it: offer a reload after a while.
    setTimeout(function () {
      var boot = document.getElementById('boot');
      if (boot.classList.contains('done') || boot.querySelector('button')) return;
      document.getElementById('boot-msg').textContent = 'This is taking longer than it should.';
      var b = document.createElement('button');
      b.textContent = 'Reload';
      b.onclick = function () { location.reload(); };
      boot.appendChild(b);
    }, 20000);
  </script>
</body>
</html>
